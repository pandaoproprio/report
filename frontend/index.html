<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Relatórios</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Relatórios</h1>
            <p class="subtitle">Gerencie seus relatórios de forma eficiente</p>
        </header>

        <div class="dashboard">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📊</div>
                    <div class="stat-content">
                        <h3>Total de Relatórios</h3>
                        <p class="stat-value" id="totalReports">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-content">
                        <h3>Valor Total</h3>
                        <p class="stat-value" id="totalValue">R$ 0,00</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">⏳</div>
                    <div class="stat-content">
                        <h3>Pendentes</h3>
                        <p class="stat-value" id="pendingReports">0</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✅</div>
                    <div class="stat-content">
                        <h3>Concluídos</h3>
                        <p class="stat-value" id="completedReports">0</p>
                    </div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="chart-container">
                    <h3>Relatórios por Status</h3>
                    <canvas id="statusChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Relatórios por Categoria</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="openModal()">+ Novo Relatório</button>
            <button class="btn btn-secondary" onclick="exportPDF()">📄 Exportar PDF</button>
            <button class="btn btn-secondary" onclick="exportExcel()">📊 Exportar Excel</button>
        </div>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Buscar relatórios..." onkeyup="filterReports()">
            <select id="categoryFilter" onchange="filterReports()">
                <option value="">Todas as categorias</option>
                <option value="vendas">Vendas</option>
                <option value="financeiro">Financeiro</option>
                <option value="marketing">Marketing</option>
                <option value="operacional">Operacional</option>
            </select>
            <select id="statusFilter" onchange="filterReports()">
                <option value="">Todos os status</option>
                <option value="pending">Pendente</option>
                <option value="in_progress">Em Progresso</option>
                <option value="completed">Concluído</option>
                <option value="cancelled">Cancelado</option>
            </select>
        </div>

        <div class="reports-table">
            <table id="reportsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Categoria</th>
                        <th>Status</th>
                        <th>Valor</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="reportsBody">
                </tbody>
            </table>
        </div>
    </div>

    <div id="reportModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Novo Relatório</h2>
            <form id="reportForm" onsubmit="saveReport(event)">
                <input type="hidden" id="reportId">

                <div class="form-group">
                    <label for="title">Título *</label>
                    <input type="text" id="title" required>
                </div>

                <div class="form-group">
                    <label for="description">Descrição</label>
                    <textarea id="description" rows="4"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Categoria *</label>
                        <select id="category" required>
                            <option value="">Selecione...</option>
                            <option value="vendas">Vendas</option>
                            <option value="financeiro">Financeiro</option>
                            <option value="marketing">Marketing</option>
                            <option value="operacional">Operacional</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" required>
                            <option value="pending">Pendente</option>
                            <option value="in_progress">Em Progresso</option>
                            <option value="completed">Concluído</option>
                            <option value="cancelled">Cancelado</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="value">Valor (R$)</label>
                    <input type="number" id="value" step="0.01" min="0" value="0">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="js/app.js"></script>
</body>
</html>
